  const w = NOW.where || {};
  const names = Object.keys(w).sort((a, b) => w[b].t - w[a].t);
  // 見るキャラ: 選んだキャラ → いまプレイ中 → 最後に動いたキャラ
  const cur = (PICK && w[PICK]) ? PICK : (NOW.current || []).find((n) => w[n]) || names[0];
  $("#st").textContent = (FAIL > 2 ? "ツールが止まっているみたい / " : "") + "1秒ごとに更新中" + (SHEET_ERR ? "" : "・耐性はシートから");
  $("#where").innerHTML = names.map((n) => `<span class="chip ${n === cur ? "on" : ""} ${w[n].map.includes("@") ? "md" : ""}" data-n="${resc(n)}">${resc(n)}：${resc(w[n].map.includes("@") ? (w[n].md || w[n].map) : w[n].map)}</span>`).join("");
  let h = "";
  if (!cur) h = `<div class="out">まだ場所がわかりません。ROでマップ移動すると出ます。</div>`;
  else {
    const p = w[cur], inMd = p.map.includes("@");
    h += `<div class="now"><b>${resc(cur)}</b> は <b>${resc(inMd ? (p.md || "MD") : p.map)}</b> ${inMd ? `<span class="sub">(${resc(p.map)})</span>` : ""} <span class="sub">${ago(p.t)}</span></div>`;
    if (!inMd) h += `<div class="out">MDの外にいます。MDに入ると、ここに必要な耐性が出ます。</div>`;
    else {
      const E = resistMatch(ENTRIES, p.map, p.md);
      h += E ? `<div class="big">${resistCard(E, { hot: true })}</div>`
             : `<div class="out">このMDはシートに見つかりませんでした。<br>シートの「判定キー」に <b>${resc(p.map.replace(/^.*@/, ""))}</b>${p.md ? ` か <b>${resc(p.md)}</b>` : ""} を書き足すと出るようになります。</div>`;
    }
  }
  if (SHEET_ERR) h += `<div class="warn">${resc(SHEET_ERR)}</div>`;
  $("#main").innerHTML = h;
}
function drawAll() {
  const q = rnorm($("#q").value);
  $("#all").innerHTML = ENTRIES.filter((E) => !q || rnorm(E.name + E.keys.join()).includes(q)).map((E) => resistCard(E)).join("");
}
$("#where").onclick = (e) => { const c = e.target.closest("[data-n]"); if (c) { PICK = PICK === c.dataset.n ? null : c.dataset.n; draw(); } };
$("#q").oninput = drawAll;
loadSheet(); poll();
setInterval(poll, 1000); setInterval(loadSheet, 60000);
</script></body></html>
