<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fox_MD_Tracker</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1f2328; --muted: #6b6f76; --line: #e3e1dc;
    --accent: #3b5bdb; --ok: #2f9e44; --okbg: #e6f4ea; --wait: #8a8f98; --soon: #e8a100; --chip: #eef0f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --panel: #1f2227; --ink: #e8e9eb; --muted: #9aa0a8; --line: #30343b;
      --accent: #7b93ff; --ok: #51cf66; --okbg: #1f3326; --wait: #8a9099; --soon: #fcc419; --chip: #2a2e35;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin: 8px 0 14px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  #login { max-width: 360px; margin: 18vh auto 0; padding: 24px; text-align: center; }
  #login input, .inp { width: 100%; font-size: 16px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  #login input { margin: 12px 0; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 9px 16px; background: var(--accent); color: #fff; }
  button:not(:disabled):active { background-image: linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.28)); }      /* 押しているあいだだけ、色が濃くなる */
  .whochar { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--chip); white-space: nowrap; }
  .whochar.on::before { content: "●"; color: #3ecf6e; margin-right: 5px; }
  .whochar.off { color: var(--muted); }
  .busybar { display: flex; align-items: center; gap: 8px; margin: 6px 0; padding: 7px 12px; border-radius: 8px; background: #ffd54a; color: #3a2d00; font-weight: 700; }
  .busybar::before { content: ""; width: 14px; height: 14px; border: 3px solid #3a2d00; border-top-color: transparent; border-radius: 50%; animation: busyspin .8s linear infinite; flex: none; }
  @keyframes busyspin { to { transform: rotate(360deg); } }
  .spin { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
  .spin::before { content: ""; width: 14px; height: 14px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: busyspin .8s linear infinite; flex: none; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 5px 10px; }
  button.gear { font-size: 16px; line-height: 1; padding: 4px 9px; }
  button.gear.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .err { color: #d9480f; font-size: 13px; min-height: 1.5em; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs button { background: var(--panel); color: var(--muted); border: 1px solid var(--line); padding: 7px 14px; }
  .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .srvtabs { align-self: center; }
  /* 計算機は横に広いので、画面の幅いっぱいに出す */
  #calcwrap { width: calc(100vw - 24px); margin-left: calc(50% - 50vw + 12px); }
  #calcbar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-bottom: 8px; font-size: 13px; }
  #calcbar select { max-width: 260px; }
  #calcreport { margin-bottom: 8px; font-size: 13px; }
  #calcreport .rr { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 4px 0; border-top: 1px solid var(--line); }
  #calcreport .rr input { font: inherit; padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); flex: 1 1 260px; min-width: 180px; }
  #calcframe { width: 100%; height: calc(100vh - 190px); min-height: 420px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .srvtabs select { font-size: 13px; padding: 3px 8px; border-radius: 8px; }
  td.char.sel, th.sel { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--chip); }
  thead th[data-g] { cursor: pointer; user-select: none; }
  thead th[data-g] .mx-ico { cursor: grab; }
  .grip.mx-ico { opacity: 1; padding: 0; color: inherit; }      /* アイコンは「つまみ」でも薄くしない */
  a.stag { text-decoration: none; cursor: pointer; }
  .eq-h input.eqcolor { width: 28px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
  td.char { cursor: pointer; }
  .carry { display: inline-block; margin-left: 4px; padding: 0 4px; border-radius: 8px; font-size: 11px; font-weight: 700; background: #b45309; color: #fff; cursor: pointer; vertical-align: baseline; }
  .carry.stale { opacity: .55; }
  .hwd { display: inline-block; min-width: 18px; padding: 0 4px; border-radius: 4px; font-size: 11px; font-weight: 700; color: #fff; text-align: center; } .hwd-s { background: #2b6cb0; } .hwd-e { background: #b7791f; }
  table.hwt td, table.lnt td { text-align: left; } table.lnt tr.done td { opacity: .45; } table.lnt tr.done td:nth-child(3) { text-decoration: line-through; } .lid { font-size: 11px; }
  .lbar { display: inline-block; width: 160px; height: 8px; background: rgba(128,128,128,.25); border-radius: 4px; overflow: hidden; } .lbar i { display: block; height: 100%; background: #2f9e44; }
  .eq-t tr.dim td, .eq-t tr.dim th { opacity: .45; } button.cig { margin-left: 6px; padding: 0 6px; font-size: 11px; }
  .carry.set { background: none; padding: 0; } .carry .ctag { display: inline-block; min-width: 14px; padding: 0 4px; margin-right: 2px; border-radius: 4px; color: #fff; text-align: center; }
  .carry-box { margin-top: 8px; } .carry-box h3 { margin: 10px 0 2px; font-size: 13px; }
  td.char .ch-sub { display: block; font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 16px; line-height: 1.2; }
  .stag { color: #fff !important; font-weight: 700; }
  .jobchip { display: inline-block; font-size: 10px; font-weight: 700; line-height: 1.5; padding: 0 5px; border-radius: 4px; color: #fff; margin-left: 4px; vertical-align: 1px; }
  .tabs .count { font-size: 12px; opacity: .85; margin-left: 4px; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: separate; border-spacing: 0; font-size: 14px; width: 100%; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
  thead th { font-size: 12px; color: var(--muted); font-weight: 600; vertical-align: bottom; white-space: normal; min-width: 92px; max-width: 140px; }
  th.char, td.char { position: sticky; left: 0; background: var(--panel); text-align: left; font-weight: 600; z-index: 1; min-width: 120px; }
  thead th.char { z-index: 2; }
  .grip { cursor: grab; color: var(--muted); opacity: .35; padding: 0 6px 0 0; touch-action: none; user-select: none; }
  tr:hover > .char .grip, .row:hover .grip { opacity: 1; }
  .dragging { opacity: .45; }
  .drop-above { box-shadow: inset 0 3px 0 var(--accent); }
  .drop-below { box-shadow: inset 0 -3px 0 var(--accent); }
  tr.drop-above > td { box-shadow: inset 0 3px 0 var(--accent); }
  th.drop-left { box-shadow: inset 3px 0 0 var(--accent); }
  th.drop-right { box-shadow: inset -3px 0 0 var(--accent); }
  .ctx { position: fixed; z-index: 50; min-width: 200px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.18); padding: 4px; font-size: 14px; }
  .ctx button { display: block; width: 100%; text-align: left; background: transparent; color: var(--ink); padding: 7px 12px; border-radius: 6px; }
  .ctx button:hover { background: var(--chip); }
  .ctx .sep { height: 1px; background: var(--line); margin: 4px 6px; }
  .ctx .cap { font-size: 11px; color: var(--muted); padding: 4px 12px 2px; }
  .mx-grip { display: block; padding: 0; line-height: 1; font-size: 11px; letter-spacing: -1px; }
  thead th:hover .mx-grip { opacity: 1; }
  tr.drop-below > td { box-shadow: inset 0 -3px 0 var(--accent); }
  body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none; }
  .sortbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; font-size: 13px; }
  td.cell { font-variant-numeric: tabular-nums; }
  .okc { color: var(--ok); font-weight: 700; background: var(--okbg); }
  .wait { color: var(--wait); }
  .soon { color: var(--soon); }
  .none { color: var(--line); }
  .evbox { margin-bottom: 12px; overflow: hidden; }
  .evbox > summary { cursor: pointer; padding: 10px 12px; list-style: revert; }
  .evmeta { color: var(--muted); font-size: 12px; margin-left: 8px; }
  td.evq, th.evq { text-align: left; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td.evk { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .evon { color: var(--wait); font-weight: 600; }
  .when { display: block; font-size: 11px; color: var(--muted); }
  .kind { display: inline-block; font-size: 10px; padding: 0 6px; border-radius: 99px; background: var(--chip); margin-top: 2px; }
  tfoot td { font-size: 12px; color: var(--muted); border-bottom: 0; }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  .opts { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
  .list { padding: 4px 0; }
  .row { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .row:last-child { border-bottom: 0; }
  .row .nm { flex: 1 1 200px; min-width: 0; }
  .row select { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .row input.lbl { width: 140px; font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  h2 { font-size: 15px; margin: 20px 0 8px; }
  .muted { color: var(--muted); font-size: 12px; }
  .hist td { text-align: left; }
  .hint { font-size: 12px; color: var(--muted); margin: 10px 2px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .card { padding: 12px 14px; }
  .card b { display: block; font-size: 22px; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .card span { color: var(--muted); font-size: 12px; }
  .bar { height: 8px; border-radius: 99px; background: var(--chip); overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  td.l, th.l { text-align: left; }
  .mdi { width: 40px; height: 40px; image-rendering: pixelated; display: block; margin: 0 auto 3px; }
  .mdi-s { width: 28px; height: 28px; image-rendering: pixelated; vertical-align: middle; margin-right: 6px; }
  .mdi-ph { display: block; height: 43px; }
  .tag { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 99px; background: var(--chip); color: var(--muted); }
  .tag.on { background: var(--okbg); color: var(--ok); font-weight: 600; }
  @media (max-width: 600px) {
    .wrap { padding: 12px; }
    th, td { padding: 7px 6px; }
    thead th { min-width: 76px; }
    th.char, td.char { min-width: 96px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="panel" hidden>
    <h1>Fox_MD_Tracker</h1>
    <input id="pw" type="password" placeholder="合言葉" autocomplete="current-password">
    <button id="go">ひらく</button>
    <div class="err" id="lerr"></div>
  </div>

  <div id="app" hidden>
    <header>
      <h1>Fox_MD_Tracker</h1>
      <span class="sub" id="upd"></span>
      <span class="srvtabs" id="srvtabs"></span>
      <span class="whochar" id="whochar"></span>
      <span style="flex:1"></span>
      <button class="ghost" id="reload">更新</button>
      <button class="ghost gear" id="gear" title="イベント・入場履歴・設定">⚙</button>
      <button class="ghost" id="logout">ログアウト</button>
    </header>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
    <!-- 計算機(ROラトリオHub)。タブを切りかえても中身(入力した内容)が消えないよう、#view の外に置いたままにする -->
    <div id="calcwrap" hidden><div id="calcbar"></div><div id="calcreport"></div><div id="calcbody"></div></div>
  </div>
</div>

<!-- 画面の中身は web/ に機能ごとに分けてある(順番どおりに読み込む。どれも同じ1つの名前空間を共有する) -->

</body>
</html>
