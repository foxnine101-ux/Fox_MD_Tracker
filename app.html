<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fox_MD_Tracker</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1f2328; --muted: #6b6f76; --line: #e3e1dc;
    --accent: #3b5bdb; --ok: #2f9e44; --okbg: #e6f4ea; --wait: #8a8f98; --soon: #e8a100; --chip: #eef0f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --panel: #1f2227; --ink: #e8e9eb; --muted: #9aa0a8; --line: #30343b;
      --accent: #7b93ff; --ok: #51cf66; --okbg: #1f3326; --wait: #8a9099; --soon: #fcc419; --chip: #2a2e35;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin: 8px 0 14px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  #login { max-width: 360px; margin: 18vh auto 0; padding: 24px; text-align: center; }
  #login input, .inp { width: 100%; font-size: 16px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  #login input { margin: 12px 0; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 9px 16px; background: var(--accent); color: #fff; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 5px 10px; }
  .err { color: #d9480f; font-size: 13px; min-height: 1.5em; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs button { background: var(--panel); color: var(--muted); border: 1px solid var(--line); padding: 7px 14px; }
  .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tabs .count { font-size: 12px; opacity: .85; margin-left: 4px; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: separate; border-spacing: 0; font-size: 14px; width: 100%; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
  thead th { font-size: 12px; color: var(--muted); font-weight: 600; vertical-align: bottom; white-space: normal; min-width: 92px; max-width: 140px; }
  th.char, td.char { position: sticky; left: 0; background: var(--panel); text-align: left; font-weight: 600; z-index: 1; min-width: 120px; }
  thead th.char { z-index: 2; }
  .grip { cursor: grab; color: var(--muted); opacity: .35; padding: 0 6px 0 0; touch-action: none; user-select: none; }
  tr:hover > .char .grip, .row:hover .grip { opacity: 1; }
  .dragging { opacity: .45; }
  .drop-above { box-shadow: inset 0 3px 0 var(--accent); }
  .drop-below { box-shadow: inset 0 -3px 0 var(--accent); }
  tr.drop-above > td { box-shadow: inset 0 3px 0 var(--accent); }
  th.drop-left { box-shadow: inset 3px 0 0 var(--accent); }
  th.drop-right { box-shadow: inset -3px 0 0 var(--accent); }
  .ctx { position: fixed; z-index: 50; min-width: 200px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.18); padding: 4px; font-size: 14px; }
  .ctx button { display: block; width: 100%; text-align: left; background: transparent; color: var(--ink); padding: 7px 12px; border-radius: 6px; }
  .ctx button:hover { background: var(--chip); }
  .ctx .sep { height: 1px; background: var(--line); margin: 4px 6px; }
  .ctx .cap { font-size: 11px; color: var(--muted); padding: 4px 12px 2px; }
  .mx-grip { display: block; padding: 0; line-height: 1; font-size: 11px; letter-spacing: -1px; }
  thead th:hover .mx-grip { opacity: 1; }
  tr.drop-below > td { box-shadow: inset 0 -3px 0 var(--accent); }
  body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none; }
  .sortbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; font-size: 13px; }
  td.cell { font-variant-numeric: tabular-nums; }
  .okc { color: var(--ok); font-weight: 700; background: var(--okbg); }
  .wait { color: var(--wait); }
  .soon { color: var(--soon); }
  .none { color: var(--line); }
  .evbox { margin-bottom: 12px; overflow: hidden; }
  .evbox > summary { cursor: pointer; padding: 10px 12px; list-style: revert; }
  .evmeta { color: var(--muted); font-size: 12px; margin-left: 8px; }
  td.evq, th.evq { text-align: left; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td.evk { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .evon { color: var(--wait); font-weight: 600; }
  .when { display: block; font-size: 11px; color: var(--muted); }
  .kind { display: inline-block; font-size: 10px; padding: 0 6px; border-radius: 99px; background: var(--chip); margin-top: 2px; }
  tfoot td { font-size: 12px; color: var(--muted); border-bottom: 0; }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  .opts { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
  .list { padding: 4px 0; }
  .row { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .row:last-child { border-bottom: 0; }
  .row .nm { flex: 1 1 200px; min-width: 0; }
  .row select { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .row input.lbl { width: 140px; font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  h2 { font-size: 15px; margin: 20px 0 8px; }
  .muted { color: var(--muted); font-size: 12px; }
  .hist td { text-align: left; }
  .hint { font-size: 12px; color: var(--muted); margin: 10px 2px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .card { padding: 12px 14px; }
  .card b { display: block; font-size: 22px; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .card span { color: var(--muted); font-size: 12px; }
  .bar { height: 8px; border-radius: 99px; background: var(--chip); overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  td.l, th.l { text-align: left; }
  .mdi { width: 40px; height: 40px; image-rendering: pixelated; display: block; margin: 0 auto 3px; }
  .mdi-s { width: 28px; height: 28px; image-rendering: pixelated; vertical-align: middle; margin-right: 6px; }
  .mdi-ph { display: block; height: 43px; }
  .tag { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 99px; background: var(--chip); color: var(--muted); }
  .tag.on { background: var(--okbg); color: var(--ok); font-weight: 600; }
  @media (max-width: 600px) {
    .wrap { padding: 12px; }
    th, td { padding: 7px 6px; }
    thead th { min-width: 76px; }
    th.char, td.char { min-width: 96px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="panel" hidden>
    <h1>Fox_MD_Tracker</h1>
    <input id="pw" type="password" placeholder="合言葉" autocomplete="current-password">
    <button id="go">ひらく</button>
    <div class="err" id="lerr"></div>
  </div>

  <div id="app" hidden>
    <header>
      <h1>Fox_MD_Tracker</h1>
      <span class="sub" id="upd"></span>
      <span style="flex:1"></span>
      <button class="ghost" id="reload">更新</button>
      <button class="ghost" id="logout">ログアウト</button>
    </header>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>
</div>

];

  if (!src) return small ? "" : '<span class="mdi-ph"></span>';
  return `<img class="${small ? "mdi-s" : "mdi"}" src="${src}" alt="">`;

// ---------- MDのまとめ方 ----------
// 「夢幻の迷宮　入場時間制限」「夢幻の迷宮　生成時間制限」→「夢幻の迷宮」
const SUFFIX = /[\s　‐\-・]*(週間|日間)?(生成|入場|挑戦|進入|受注)?(時間)?制限$/;
function groupOf(title) {
  if (/NLWD/.test(title)) return { name: title, role: "campaign" };
  if (/再入場可能時間/.test(title)) return { name: title.replace(/[\s　]*再入場可能時間$/, ""), role: "reentry" };
  if (SUFFIX.test(title) && /(生成|入場|挑戦|進入)/.test(title)) return { name: title.replace(SUFFIX, "").trim() || title, role: "md" };
  return { name: title.replace(SUFFIX, "").trim() || title, role: "other" };
}

function buildGroups() {
  const titles = DATA.titles || {}, spans = DATA.spans || {};
  const groups = new Map();
  const evIds = eventIds();
  for (const [qid, title] of Object.entries(titles)) {
    const g = groupOf(title);
    if (g.role === "reentry" || g.role === "campaign") continue;
    if (evIds.has(qid) && !Object.values(DATA.chars || {}).some((c) => ((c.quests || {})[qid] || 0) > 0)) continue;   // 期限なしのイベントクエはイベントタブだけ
    let G = groups.get(g.name);
    if (!G) { G = { name: g.name, qids: [], role: g.role, weeklyHint: false, span: 0 }; groups.set(g.name, G); }
    G.qids.push(qid);
    if (g.role === "md") G.role = "md";
    if (/週間/.test(title)) G.weeklyHint = true;
    G.span = Math.max(G.span, spans[qid] || 0);
  }
  // 週次の目印: 明ける時刻がちょうど12:00(日本時間) … jROの週次はメンテ日の12:00、デイリーは05:00
  for (const G of groups.values()) {
    for (const c of Object.values(DATA.chars || {})) for (const id of G.qids) {
      const e = (c.quests || {})[id];
      if (e && ((e + 9 * 3600) % 86400) === 12 * 3600) G.weeklyHint = true;
    }
  }
  const md = SETTINGS.md || {};
  for (const G of groups.values()) {
    const s = md[G.name] || {};
    G.auto = G.role !== "md" ? "other" : (G.weeklyHint || G.span > 26 * 3600 ? "weekly" : "daily");
    G.kind = s.kind && s.kind !== "auto" ? s.kind : G.auto;
    G.label = s.label || G.name;
    G.order = s.order ?? 9999;
  }
  return [...groups.values()];
}

function charNames() {
  const all = Object.keys(DATA.chars || {});
  const hidden = new Set(SETTINGS.hiddenChars || []);
  const order = SETTINGS.charOrder || [];
  return all.filter((n) => !hidden.has(n))
    .sort((a, b) => (idx(order, a) - idx(order, b)) || a.localeCompare(b, "ja"));
}
const idx = (arr, v) => { const i = arr.indexOf(v); return i < 0 ? 1e9 : i; };

// ---------- キャラの並び替え ----------
// shown(画面に出ている並び)を新しい順にしたとき、隠しているキャラなども含めた全体の並びを作って保存する
function saveCharOrder(shown) {
  const all = Object.keys(DATA.chars || {});
  const old = SETTINGS.charOrder || [];
  const cur = all.slice().sort((a, b) => (idx(old, a) - idx(old, b)) || a.localeCompare(b, "ja"));
  const pos = cur.map((c) => shown.includes(c));        // 画面に出ているキャラの席だけ入れかえる
  const q = shown.slice();
  SETTINGS.charOrder = cur.map((c, i) => pos[i] ? q.shift() : c);
  saveSettings(); render();
}
// MDの並び: shown(画面に出ている列の新しい並び)を、all(その分類の今の並び全部)の中の同じ席に入れて保存
function saveMdOrder(shown, all) {
  const q = shown.slice();
  const md = SETTINGS.md = SETTINGS.md || {};
  all.map((n) => shown.includes(n) ? q.shift() : n)
    .forEach((n, i) => { md[n] = { ...(md[n] || {}), order: i }; });
  saveSettings(); render();
}
// ⋮⋮ をつかんで上下(左右)に動かす(マウスでも指でも)
let DRAGGING = false;
function makeSortable(box, rowSel, names, onDone = saveCharOrder, axis = "y") {
  const X = axis === "x";
  if (!box) return;
  box.querySelectorAll(rowSel).forEach((row) => {
    const grip = row.querySelector(".grip");
    if (!grip) return;
    grip.onpointerdown = (ev) => {
      if (ev.button > 0) return;
      ev.preventDefault();
      const rows = [...box.querySelectorAll(rowSel)];
      const from = rows.indexOf(row);
      let to = from;
      DRAGGING = true;
      document.body.classList.add("is-dragging");
      row.classList.add("dragging");
      const [BEFORE, AFTER] = X ? ["drop-left", "drop-right"] : ["drop-above", "drop-below"];
      const clear = () => rows.forEach((r) => r.classList.remove(BEFORE, AFTER));
      const onMove = (e) => {
        clear();
        // 指の位置にある行(列)を探す(前半分=その前に、後ろ半分=その後に入れる)
        const p = X ? e.clientX : e.clientY;
        let i = rows.findIndex((r) => { const b = r.getBoundingClientRect(); return p < (X ? b.right : b.bottom); });
        if (i < 0) i = rows.length - 1;
        const b = rows[i].getBoundingClientRect();
        const below = X ? p > b.left + b.width / 2 : p > b.top + b.height / 2;
        rows[i].classList.add(below ? AFTER : BEFORE);
        to = i + (below ? 1 : 0);
        if (to > from) to--;                    // 自分が抜けたぶんずれる
      };
      const onUp = () => {
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        document.removeEventListener("pointercancel", onUp);
        clear(); row.classList.remove("dragging");
        document.body.classList.remove("is-dragging");
        DRAGGING = false;
        if (to === from) return;
        const arr = names.slice(); const [x] = arr.splice(from, 1); arr.splice(to, 0, x);
        onDone(arr);
      };
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onUp);
    };
  });
}

// キャラ c の グループ G の「また入れる時刻」(秒)。記録なし=null
function endOf(c, G) {
  const q = (DATA.chars[c] || {}).quests || {};
  let e = null;
  for (const id of G.qids) if (id in q) e = Math.max(e ?? 0, q[id]);
  return e;
}

function remain(sec) {
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  if (d > 0) return `${d}日${h}時間`;
  if (h > 0) return `${h}時間${m}分`;
  return `${Math.max(m, 1)}分`;
}
const WD = "日月火水木金土";
function when(t) {
  const d = new Date(t * 1000);
  return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]}) ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

// ---------- 画面 ----------
const TABS = [["weekly", "週次"], ["daily", "デイリー"], ["other", "その他"], ["resist", "耐性"], ["dmg", "被ダメ"], ["equip", "装備"], ["nyar", "ニャル様"], ["event", "イベント"], ["history", "入場履歴"], ["settings", "設定"]];

function render() {
  if (!DATA || DRAGGING) return;          // 並び替えの途中は描き直さない
  if (document.activeElement && document.activeElement.matches("input.skfix, select.skattr, input.eqname")) return;   // 名前を入力中・選んでいる途中も
  const now = Date.now() / 1000;
  const groups = buildGroups();
  const chars = charNames();
  const countOk = (kind) => {
    let n = 0;
    for (const G of groups) if (G.kind === kind) for (const c of chars) { const e = endOf(c, G); if (e !== null && e <= now) n++; }
    return n;
  };
  $("#tabs").innerHTML = TABS.map(([k, l]) => {
    const n = ["weekly", "daily"].includes(k) ? countOk(k) : 0;
    if (k === "event") { const m = eventGroups(chars).length; return `<button data-tab="${k}" class="${TAB === k ? "on" : ""}">${l}${m ? `<span class="count">${m}件</span>` : ""}</button>`; }
    return `<button data-tab="${k}" class="${TAB === k ? "on" : ""}">${l}${n ? `<span class="count">行ける${n}</span>` : ""}</button>`;
  }).join("");
  $("#upd").textContent = DATA.updated ? `最終受信 ${when(DATA.updated)}` : "まだ記録がありません";
  $("#view").onclick = null;
  if (TAB === "history") return renderHistory();
  if (TAB === "nyar") return renderNyar(groups, chars, now);
  if (TAB === "event") return renderEvents(chars, now);
  if (TAB === "resist") return renderResist(chars, now);
  if (TAB === "dmg") return renderDmg(chars, now);
  if (TAB === "equip") return renderEquip(chars);
  if (TAB === "settings") return renderSettings(groups);
  renderGrid(groups.filter((G) => G.kind === TAB), chars, now);
}

// ---------- 右クリックのメニュー ----------
// items: [{label, act}] / "-"(区切り) / {cap: "見出し"}
function showCtx(x, y, items) {

function renderGrid(groups, chars, now) {
  const hidden = buildGroups().filter((G) => G.kind === "hide").sort((a, b) => a.label.localeCompare(b.label, "ja"));
  const hiddenBtn = hidden.length ? ` <button class="ghost" id="mdhidden">隠したMD（${hidden.length}）</button>` : "";
  groups.sort((a, b) => (a.order - b.order) || a.label.localeCompare(b.label, "ja"));
  if (!chars.length) {
    $("#view").innerHTML = `<div class="panel empty">まだキャラの記録がありません。<br>PCでツールを動かしたままROにログインすると、ここに出ます。</div>`;
    return;
  }
  if (!groups.length) {
    $("#view").innerHTML = `<div class="panel empty">この分類のMDはまだありません。<br>「設定」で分類を変えられます。${hiddenBtn}</div>`;
    if (hidden.length) $("#mdhidden").onclick = (e) => { const r = e.target.getBoundingClientRect(); showCtx(r.left, r.bottom + 4, hiddenMenu(hidden)); };
    return;
  }
  let cols = groups;
  if (ONLY_OK) cols = groups.filter((G) => chars.some((c) => { const e = endOf(c, G); return e !== null && e <= now; }));
  let h = `<div class="opts"><label><input type="checkbox" id="onlyok" ${ONLY_OK ? "checked" : ""}> 行けるMDがある列だけ</label>${hiddenBtn}
    <span>● 行ける ／ 数字 = あと何時間でまた行けるか ／ ー = 記録なし</span></div>`;
  h += `<div class="panel tablewrap"><table><thead><tr><th class="char">キャラ</th>`;
  loadResistSheet();
  const canGo = new Map(cols.map((G) => [G.name, G.role === "md" || !!resistFind(RZ.entries, G.name)]));
  if (MX_FOCUS && !cols.some((G) => G.name === MX_FOCUS)) cols = groups;   // 戻ってきた列が隠れていたら全部出す
  // 見出し: アイコン(クリックでグレー表示を固定) + MD名(クリックで耐性へ)
  cols.forEach((G, i) => h += `<th data-ci="${i}" data-g="${esc(G.name)}" title="${esc(G.name)}"><span class="grip mx-grip" title="つかんで左右に動かすと、MDの並びを変えられます">⋮⋮</span><span class="mx-ico" title="クリックで固定（もう一度・ほかをクリックで解除）">${iconImg(G.name)}</span>`
    + (canGo.get(G.name) ? `<span class="mx-name rzgo" data-go="${esc(G.name)}" title="クリックで耐性を見る">${esc(G.label)}</span>` : `<span class="mx-name">${esc(G.label)}</span>`) + `</th>`);
  h += `</tr></thead><tbody>`;
  for (const c of chars) {
    h += `<tr data-char="${esc(c)}"><td class="char" title="${esc(c)}（左の ⋮⋮ をつかんで上下に動かすと並び替え）"><span class="grip">⋮⋮</span>${esc(c)}</td>`;
    cols.forEach((G, i) => {
      const e = endOf(c, G), ci = `data-ci="${i}"`;
      if (e === null) h += `<td class="cell none" ${ci}>ー</td>`;
      else if (e <= now) h += `<td class="cell okc" ${ci}>●</td>`;
      else {
        const r = e - now;

      }
    });
    h += `</tr>`;

  for (const G of cols) {

    h += `<td>${ok}/${chars.length}</td>`;
  }
  h += `</tr></tfoot></table></div>`;

  makeSortable($("#view").querySelector("tbody"), "tr[data-char]", chars);
  makeSortable($("#view").querySelector("thead tr"), "th[data-g]", cols.map((G) => G.name),

  const rows = [...$("#view").querySelectorAll("tbody tr")];
  const waitRows = cols.map((G) => new Set(chars.map((c, r) => { const e = endOf(c, G); return e !== null && e > now ? r : -1; }).filter((r) => r >= 0)));
  const ths = [...$("#view").querySelectorAll("thead th[data-ci]")];

  const show = (i, lock) => {

    if (i < 0 || !ths[i]) return;
    ths[i].classList.add("hl-col");
    if (lock) ths[i].classList.add("mx-lock");
    // 選んだ列以外は全部グレー、選んだ列ではCT中(数字)のキャラをグレー
    ths.forEach((th, j) => { if (j !== i) th.classList.add("mx-off"); });

    $("#view").querySelectorAll("tfoot td").forEach((x, j) => { if (j > 0 && j - 1 !== i) x.classList.add("mx-off"); });
    rows.forEach((tr, r) => { if (waitRows[i].has(r)) tr.classList.add("mx-dim"); });
  };
  const lockedIdx = () => ths.findIndex((th) => th.dataset.g === MX_LOCK);
  ths.forEach((th, i) => {

    th.onmouseleave = () => { if (!MX_LOCK) clearHl(); };
  });
  GRID_CLICK = (ev) => {
    const name = ev.target.closest(".mx-name[data-go]");
    if (name) { MX_LOCK = ""; return goResist(name.dataset.go); }
    const hit = ev.target.closest(".mx-ico, td.cell[data-ci]");
    const i = hit ? +(hit.closest("[data-ci]").dataset.ci) : -1;
    const grayCell = hit && hit.matches("td") && (hit.classList.contains("mx-off") || hit.closest("tr.mx-dim"));
    if (i >= 0 && !(MX_LOCK && lockedIdx() === i) && !grayCell) { MX_LOCK = ths[i].dataset.g; show(i, true); }
    else { MX_LOCK = ""; clearHl(); }          // グレーの所・同じ列・ほかをクリック → 解除
  };
  if (MX_LOCK) { const i = lockedIdx(); if (i >= 0) show(i, true); else MX_LOCK = ""; }   // 再描画しても固定を保つ
  // 耐性ページから戻ってきた列を見せる(固定した状態にする)
  if (MX_FOCUS) {
    const i = ths.findIndex((x) => x.dataset.g === MX_FOCUS);
    MX_FOCUS = "";
    if (i >= 0) {
      ths[i].scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
      const cells = [ths[i], ...$("#view").querySelectorAll(`td[data-ci="${i}"]`)];

}

function bindSkillFix() {

    h += `</tbody></table></div></details>`;
  }
  h += `<p class="hint">受注中 = クエストを受けている ／ 報告済 = 報告まで終わった ／ 時間 = 期限やCTの残り ／ ● = CTが明けた ／ ー = 受けていない</p>`;
  $("#view").innerHTML = h;
  for (const d of document.querySelectorAll("details.evbox")) d.ontoggle = () => {
    EV_OPEN[d.dataset.ev] = d.open; store.set("md_evopen", JSON.stringify(EV_OPEN));
  };
}

// ---------- ニャル様のラッキーお散歩デイズ ----------
// 公式: https://ragnarokonline.gungho.jp/cms/news/nyar-lucky-walk-days-2609
const NYAR = {
  start: Date.parse("2026-09-29T12:00:00+09:00"),   // 9/29メンテ後(目安)
  end: Date.parse("2026-10-20T11:00:00+09:00"),     // 10/20メンテ前(目安)
  limit: 420,
  exp: [[270, 63280000000], [260, 42750000000], [250, 29250000000], [240, 20650000000], [230, 15450000000], [220, 11250000000]],
  missions: [
    ["浸食されたゲフェニア", 15, "5ミッション×3回・入場バフ中のみ報告・報告後5分CT"],
    ["破壊されたヴァルキリーレルム", 15, "5ミッション×3回・入場バフ中のみ報告・報告後5分CT"],
    ["バルムントのバイオスフィア", 15, "5ミッション×3回"],
    ["欺瞞の別荘", 20, "2ミッション(シュラン+デミフレイヤ 各5回)"],
    ["悔恨の墓", 32, "2ミッション(ティアラ姫+サクライ 各8回)"],
    ["封じられた不死者", 16, "2ミッション×8回"],
    ["変えられない最後", 16, "2ミッション×8回"],
    ["夢幻の迷宮", 40, "10階〜102階の各階"],
    ["星座の塔", 20, "5階〜75階の主・ベテルギウス"],
    ["呪われた次元（4th）", 60, "欠片01〜20・アムダライス・ヒメルメズ"],
    ["生命の殿堂", 20, "神獣4種・金の竜・リゲル"],
    ["特異点 名もなき島", 60, "暴食の力01〜20・大神官・ヴェルゼブブ"],
    ["特異点 生体工学研究所", 30, "思念体1〜8体・コア実験体"],
    ["特異点 タナトスタワー", 90, "傲慢のエナジー50〜1000点・タナトス2種"],
  ],
};
const norm = (x) => String(x).replace(/[\s　]/g, "").replace(/（/g, "(").replace(/）/g, ")").toLowerCase();
function nyarExp(lv) { for (const [lo, e] of NYAR.exp) if (lv >= lo) return e; return 0; }
function weekStart(nowSec) {   // 火曜12:00(日本時間)
  const jst = nowSec + 9 * 3600, day = Math.floor(jst / 86400), wd = (day + 3) % 7;
  let s = (day - ((wd - 1 + 7) % 7)) * 86400 + 12 * 3600 - 9 * 3600;
  if (s > nowSec) s -= 7 * 86400;
  return s;
}
// 経験値の桁: K / M / G / T (1G = 10億)
const oku = (n) => {
  for (const [v, u] of [[1e12, "T"], [1e9, "G"], [1e6, "M"], [1e3, "K"]])
    if (n >= v) return (n / v).toLocaleString("en-US", { maximumFractionDigits: 2 }) + u;
  return String(n);
};

function renderNyar(groups, chars, now) {
  const ws = weekStart(now), nextReset = ws + 7 * 86400;
  const live = now * 1000 >= NYAR.start && now * 1000 < NYAR.end;
  const C = DATA.chars || {};
  const used = (c) => { const n = C[c].nyar; return n && n.week === ws ? n.count : 0; };
  // アカウントごとに合計(アカウント不明は1つにまとめる)
  const accs = new Map();
  const known = [...new Set(chars.map((c) => C[c].account).filter(Boolean))];
  const accOf = (c) => C[c].account || (known.length === 1 ? known[0] : "?");   // アカウントが1つしか分からなければ、不明なキャラもそれ
  for (const c of chars) {
    const a = accOf(c);
    if (!accs.has(a)) accs.set(a, { chars: [], used: 0 });
    const A = accs.get(a); A.chars.push(c); A.used += used(c);
  }
  let h = `<div class="cards">
    <div class="panel card"><span>開催期間</span><b>9/29〜10/20</b><span>${live ? "開催中" : (now * 1000 < NYAR.start ? "開催前" : "終了")}・各ミッション 火曜12:00 リセット</span></div>
    <div class="panel card"><span>今週のリセットまで</span><b>${remain(nextReset - now)}</b><span>${when(nextReset)}</span></div>`;
  for (const [a, A] of accs) {
    // ニャル様の会話で見た公式の回数(今週・いちばん新しいもの)があればそれを使う
    let off = null;
    for (const c of A.chars) { const o = (C[c].nyar && C[c].nyar.week === ws && C[c].nyar.acc_official) || null; if (o && (!off || o.t > off.t)) off = o; }
    if (off && off.n >= 0) { A.official = off; A.used = Math.max(off.n, 0); }
  }
  for (const [a, A] of accs) {
    const pct = Math.min(100, A.used / NYAR.limit * 100);
    h += `<div class="panel card"><span>${a === "?" ? "アカウント不明" : "アカウント（ID末尾 " + esc(String(a)).slice(-4) + "）"} の今週の報告回数</span>
      <b>${A.used} / ${NYAR.limit}</b><span>残り ${NYAR.limit - A.used} 回${A.official ? "・公式(" + when(A.official.t) + "にニャル様で確認)" : "・ツールの記録の合計"}</span><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }
  h += `</div>`;

  // おすすめ: 残り回数をどのキャラで使うと経験値が一番多いか
  const rows = chars.map((c) => {
    const lv = C[c].lv || 0, e = nyarExp(lv), A = accs.get(accOf(c));
    const left = Math.max(0, Math.min(NYAR.limit - used(c), NYAR.limit - A.used));
    return { c, lv, e, u: used(c), left };
  }).sort((x, y) => y.e - x.e || y.lv - x.lv);
  h += `<h2>キャラ別（1回あたりの Base経験値が多い順）</h2><div class="panel tablewrap"><table><thead><tr>
    <th class="char">キャラ</th><th>BaseLv</th><th>1回あたり</th><th>今週の報告</th><th>残りを全部使うと</th></tr></thead><tbody>`;
  for (const r of rows) {
    h += `<tr><td class="char">${esc(r.c)}</td><td>${r.lv || "?"}</td>
      <td>${r.e ? oku(r.e) : '<span class="muted">対象外(220未満)</span>'}</td>
      <td>${r.u}回${C[r.c].nyar && C[r.c].nyar.week === ws && C[r.c].nyar.official ? ' <span class="tag on" title="ニャル様の会話で確認">公式</span>' : ""}</td><td>${r.e ? "+" + oku(r.e * r.left) : "-"}</td></tr>`;
  }
  h += `</tbody></table></div>
    <p class="hint">1アカウント1週間で420回まで（同じアカウントのキャラ全員の合計）。全ミッションを1キャラでやると449回分あるので、1キャラで上限まで使い切れます。報告回数は「報告して完了した専用クエスト(〜NLWD) × 公式の回数表」で自動カウント（【東部】【西部】などのサブクエストは数えない）。1回あたりの経験値は公式の表の値で、経験値アップ効果は含まない。BaseLvはキャラ選択画面・ログイン時に自動取得。</p>`;

  // ミッション一覧 × キャラ
  const showChars = rows.filter((r) => r.e).map((r) => r.c);
  const gByName = new Map(groups.map((G) => [norm(G.name), G]));
  const titles = DATA.titles || {};
  h += `<h2>対象ダンジョン（今週の状況）</h2><div class="panel tablewrap"><table><thead><tr><th class="l">ダンジョン</th><th>最大</th>`;
  for (const c of showChars) h += `<th>${esc(c)}</th>`;
  h += `<th class="l">内容</th></tr></thead><tbody>`;
  for (const [md, max, note] of NYAR.missions) {
    const key = norm(md);
    const G = [...gByName.entries()].find(([k]) => k.includes(key) || key.includes(k))?.[1];
    h += `<tr><td class="l">${iconImg(md, true)}${esc(md)}</td><td>${max}</td>`;
    for (const c of showChars) {
      const q = C[c].quests || {};
      const ms = (C[c].nyar && C[c].nyar.week === ws && C[c].nyar.missions) || null;
      // ミッション(「欺瞞の別荘 1回目」など)ごとに状況を決める
      //  1) クエストに「報告済」の印がある → 報告済（報告しないともらえないので確実）
      //  2) ミッションの枠クエストを持っている → 受注中
      //  3) クエストに手がかりがない → ニャル様の会話で見た状況（古いことがあるので補助）
      const inst = new Map(), why = [];
      const ikey = (t) => norm(String(t).replace(/^【報告済】/, "").replace(/NLWD/g, ""));
      const hitKey = key.replace(/^特異点/, "");
      if (ms) for (const [k, v] of Object.entries(ms)) {
        if (/NLWD/.test(k) || !norm(k).includes(hitKey)) continue;          // 討伐などのサブクエストは除く
        inst.set(ikey(k), /報告済|完了/.test(v) ? "done" : /未受注/.test(v) ? "" : "active");
        why.push(`会話: ${k} = ${v}`);
      }
      const mine = Object.keys(q).filter((id) => /NLWD/.test(titles[id] || "") && /^(【報告済】)?NLWD/.test(titles[id]) && norm(titles[id]).includes(hitKey));
      for (const id of mine) if (!titles[id].startsWith("【報告済】") && inst.get(ikey(titles[id])) !== "done-q") inst.set(ikey(titles[id]), "active");
      for (const id of mine) if (titles[id].startsWith("【報告済】")) inst.set(ikey(titles[id]), "done-q");
      for (const id of mine) why.push(`クエスト: ${titles[id]}`);
      const vals = [...inst.values()];
      const done = vals.filter((v) => v.startsWith("done")).length;      // 報告が終わったミッション
      const active = vals.filter((v) => v === "active").length;          // 受注中のミッション
      const e = G ? endOf(c, G) : null;
      const entered = e !== null && e > now && e <= nextReset + 3600 && e >= ws;
      let cell = "";
      if (done) cell += `<span class="tag on">報告済${done}</span> `;
      // 受注はMDに入ると自動なので出さない(報告だけ見る)
      if (!done) {
        if (entered) cell += `<span class="tag">今週入場済</span>`;
        else if (e !== null && e > now) cell += `<span class="tag">CT中</span>`;
      }
      h += `<td title="${esc(why.join("\n"))}">${cell || '<span class="none">ー</span>'}</td>`;
    }
    h += `<td class="l muted">${esc(note)}</td></tr>`;
  }
  h += `</tbody></table></div>
    <p class="hint">「報告済N」= ニャル様への報告が終わったミッションの数（例: 悔恨の墓 1回目・2回目 → 報告済2）。ニャル様のクエストはMDに入ると自動で受注されるので、報告の状況だけ出しています。クエストの状態を優先し、わからない分だけニャル様の会話で補っています（マスにマウスを乗せると根拠が出ます）。「今週入場済」= そのMDのCTが今週のリセットまで残っている。</p>`;
  $("#view").innerHTML = h;
}

function renderHistory() {
  const hs = [...(DATA.history || [])].reverse().slice(0, 150);
  if (!hs.length) { $("#view").innerHTML = `<div class="panel empty">まだ入場の記録がありません。</div>`; return; }
  let h = `<div class="panel tablewrap"><table class="hist"><thead><tr><th class="char">キャラ</th><th>日時</th><th>MD（内部名）</th><th>マップ</th></tr></thead><tbody>`;
  for (const x of hs) h += `<tr><td class="char">${esc(x.char)}</td><td>${when(x.t)}</td><td>${esc(x.md || "")}</td><td class="muted">${esc(x.map)}</td></tr>`;
  $("#view").innerHTML = h + `</tbody></table></div>`;
}

function renderSettings(groups) {

  groups.sort((a, b) => (KO[a.kind] - KO[b.kind]) || (a.order - b.order) || a.label.localeCompare(b.label, "ja"));
  const mdNames = groups.map((G) => G.name);

  let h = `<h2>MDの分類と表示名</h2><p class="hint">「自動」は、名前に「週間」がある・明ける時刻がちょうど12:00・CTが26時間より長い → 週次、それ以外 → デイリー で分けています。違っていたらここで直してね。⋮⋮ をつかんで上下に動かすと、表の列の並びが変わります。</p>
    <div class="sortbar"><button class="ghost" id="mdreset">MDの並びを名前順に戻す</button></div><div class="panel list" id="mdlist">`;

      <input class="lbl" data-label="${esc(G.name)}" placeholder="表示名" value="${esc(s.label || "")}">
      <select data-kind="${esc(G.name)}">
        ${[["auto", `自動（${autoL}）`], ["weekly", "週次"], ["daily", "デイリー"], ["other", "その他"], ["hide", "表示しない"]]
          .map(([v, l]) => `<option value="${v}" ${(s.kind || "auto") === v ? "selected" : ""}>${l}</option>`).join("")}
      </select></div>`;
  }
  h += `</div><h2>キャラ</h2>
    <div class="sortbar"><span class="muted">並べかえ:</span>
      <button class="ghost" data-sort="name">名前順</button>
      <button class="ghost" data-sort="lv">Lvが高い順</button>
      <button class="ghost" data-sort="job">職業ごと</button>
      <button class="ghost" data-sort="account">アカウントごと</button>
      <button class="ghost" data-sort="seen">最近ログインした順</button>
      <span class="muted">（⋮⋮ をつかんで上下に動かしても変えられます）</span></div>
    <div class="panel list" id="charlist">`;
  const all = Object.keys(DATA.chars || {});
  const order = SETTINGS.charOrder || [];
  all.sort((a, b) => (idx(order, a) - idx(order, b)) || a.localeCompare(b, "ja"));
  const hidden = new Set(SETTINGS.hiddenChars || []);
  all.forEach((c, i) => {
    const seen = DATA.chars[c].seen;
    h += `<div class="row" data-char="${esc(c)}"><span class="nm"><span class="grip" title="つかんで上下に動かすと並び替え">⋮⋮</span>${esc(c)} <span class="muted">最終確認 ${seen ? when(seen) : "-"}</span></span>
      <button class="ghost" data-up="${i}" ${i ? "" : "disabled"}>↑</button>
      <button class="ghost" data-down="${i}" ${i < all.length - 1 ? "" : "disabled"}>↓</button>
      <label class="muted"><input type="checkbox" data-hide="${esc(c)}" ${hidden.has(c) ? "checked" : ""}> 隠す</label>
      <button class="ghost" data-del="${esc(c)}">記録を消す</button></div>`;
  });
  h += `</div><h2>耐性シート</h2><div class="panel list"><div class="row"><span class="nm">GoogleスプレッドシートのURL（空欄 = 最初に作った「MD耐性一覧」）</span>
    <input class="lbl" id="rzsheet" style="flex:1;min-width:240px" placeholder="https://docs.google.com/spreadsheets/d/…" value="${esc(SETTINGS.resistSheet || "")}"></div></div>`;
  if (typeof LOCAL !== "undefined" && LOCAL) {
    const u = UPDATE || {};
    h += `<h2>アップデート</h2><div class="panel list"><div class="row"><span class="nm">いまの版 v${esc(u.current || DATA.version || "?")}${DATA.edition ? "（" + esc(DATA.edition) + "）" : ""}
      <span class="muted">${u.state === "none" ? "（最新です）" : u.state === "available" ? `（新しい版 v${esc(u.latest.version)} があります）` : u.state === "error" ? "（" + esc(u.error) + "）" : ""}</span></span>
      <button class="ghost" id="upchk">アップデートを確認</button></div></div>`;
  }
  h += `<div class="err" id="serr"></div>`;
  $("#view").innerHTML = h;
  if ($("#upchk")) $("#upchk").onclick = async () => { $("#upchk").textContent = "確認中…"; await checkUpdate(true); render(); };
  $("#rzsheet").onchange = (e) => { SETTINGS.resistSheet = e.target.value.trim(); saveSettings(); RZ.t = 0; };

  document.querySelectorAll("[data-kind]").forEach((el) => el.onchange = () => {
    const m = SETTINGS.md = SETTINGS.md || {};
    m[el.dataset.kind] = { ...(m[el.dataset.kind] || {}), kind: el.value };
    saveSettings();
  });
  document.querySelectorAll("[data-label]").forEach((el) => el.onchange = () => {
    const m = SETTINGS.md = SETTINGS.md || {};
    m[el.dataset.label] = { ...(m[el.dataset.label] || {}), label: el.value.trim() };
    saveSettings();
  });
  const move = (i, d) => {
    const arr = all.slice(); const [x] = arr.splice(i, 1); arr.splice(i + d, 0, x);
    saveCharOrder(arr);
  };
  makeSortable($("#charlist"), ".row[data-char]", all);
  makeSortable($("#mdlist"), ".row[data-g]", mdNames, (arr) => saveMdOrder(arr, mdNames));
  $("#mdreset").onclick = () => {
    for (const v of Object.values(SETTINGS.md || {})) delete v.order;
    saveSettings(); render();
  };
  const C = DATA.chars;
  const byName = (a, b) => a.localeCompare(b, "ja", { numeric: true });
  const SORTS = {
    name: byName,
    lv: (a, b) => ((C[b].lv || 0) - (C[a].lv || 0)) || byName(a, b),
    job: (a, b) => ((C[a].job ?? 1e9) - (C[b].job ?? 1e9)) || ((C[b].lv || 0) - (C[a].lv || 0)) || byName(a, b),
    account: (a, b) => String(C[a].account ?? "~").localeCompare(String(C[b].account ?? "~"), "ja", { numeric: true }) || all.indexOf(a) - all.indexOf(b),
    seen: (a, b) => ((C[b].seen || 0) - (C[a].seen || 0)) || byName(a, b),
  };
  document.querySelectorAll("[data-sort]").forEach((el) => el.onclick = () => saveCharOrder(all.slice().sort(SORTS[el.dataset.sort])));
  document.querySelectorAll("[data-up]").forEach((el) => el.onclick = () => move(+el.dataset.up, -1));
  document.querySelectorAll("[data-down]").forEach((el) => el.onclick = () => move(+el.dataset.down, 1));
  document.querySelectorAll("[data-hide]").forEach((el) => el.onchange = () => {
    const s = new Set(SETTINGS.hiddenChars || []);
    el.checked ? s.add(el.dataset.hide) : s.delete(el.dataset.hide);
    SETTINGS.hiddenChars = [...s]; saveSettings();
  });
  document.querySelectorAll("[data-del]").forEach((el) => el.onclick = async () => {
    if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "本当に消す？"; return; }
    await api("DELETE", "?char=" + encodeURIComponent(el.dataset.del));
    await load();
  });
}

// ---------- 通信 ----------
async function api(method, q = "", body) {
  const r = await fetch("/api/data" + q, {
    method, headers: { "x-password": PW, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined, cache: "no-store",
  });
  if (r.status === 401) throw new Error("401");
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
let saveTimer = null, SAVING = false;
function saveSettings() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    saveTimer = null; SAVING = true;
    try { await api("POST", "", SETTINGS); const e = $("#serr"); if (e) e.textContent = ""; }
    catch (e) { const el = $("#serr"); if (el) el.textContent = "保存できませんでした: " + e.message; }
    finally { SAVING = false; }
  }, 400);
}
async function load() {
  try {
    const j = await api("GET");
    DATA = j.data;
    if (!saveTimer && !SAVING) SETTINGS = j.settings || {};   // 保存待ちのあいだは手元の設定を使う(並びが一瞬戻らないように)
    $("#login").hidden = true; $("#app").hidden = false;
    store.set("md_pw", PW);
    render();
  } catch (e) {
    if (e.message === "401") { showLogin(PW ? "合言葉が違います" : ""); PW = ""; store.del("md_pw"); }
    else if (typeof LOCAL !== "undefined" && LOCAL) { if (DATA) $("#upd").textContent = "ツールが止まっているみたい（Fox_MD_Trackerを起動してね）"; else showLogin("Fox_MD_Trackerが起動していません"); }
    else if (DATA) $("#upd").textContent = "通信エラー（あとで自動で再読み込みします）";
    else showLogin("読み込めませんでした: " + e.message);
  }
}
function showLogin(msg) { $("#app").hidden = true; $("#login").hidden = false; $("#lerr").textContent = msg || ""; $("#pw").focus(); }

$("#go").onclick = () => { PW = $("#pw").value.trim(); if (PW) load(); };
$("#pw").onkeydown = (e) => { if (e.key === "Enter") $("#go").click(); };
$("#logout").onclick = () => { store.del("md_pw"); PW = ""; DATA = null; showLogin(""); };
$("#reload").onclick = () => { RZ.t = 0; load(); };   // 更新ボタンは耐性シートも読み直す
$("#tabs").onclick = (e) => { const b = e.target.closest("[data-tab]"); if (!b) return; TAB = b.dataset.tab; store.set("md_tab", TAB); render(); };
setInterval(() => { if (DATA && TAB !== "settings") render(); }, 30000);
setInterval(() => { if (DATA && !document.hidden && TAB !== "settings") load(); }, 120000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && DATA) load(); });

// この PC のツール(Fox_MD_Tracker)が出しているページなら、合言葉なし・こまめに更新
const LOCAL = /^(127\.0\.0\.1|localhost)$/.test(location.hostname) && location.port === "8788";
// ---------- アップデート(この PC のツールだけ) ----------
let UPDATE = null;
async function checkUpdate(force) {
  try {
    const r = await fetch("/api/update", force ? { method: "POST" } : {});
    UPDATE = await r.json();
  } catch { UPDATE = null; }
  drawUpdate();
}
function drawUpdate() {
  let el = $("#updbar");
  if (!el) { $("#tabs").insertAdjacentHTML("beforebegin", `<div id="updbar"></div>`); el = $("#updbar"); }
  const u = UPDATE;
  if (!u || !["available", "downloading", "ready"].includes(u.state) && !(u.state === "error" && u.error && u.latest)) { el.innerHTML = ""; return; }
  const v = u.latest ? "v" + u.latest.version : "";
  let h = `<div class="panel updbar">`;
  if (u.state === "available") h += `<b>新しい版 ${esc(v)} があります</b>（いまは v${esc(u.current)}）`
    + (u.can_install ? ` <button id="upgo">今すぐアップデート</button>` : ` <span class="muted">exe 版のときにここから更新できます</span>`)
    + (u.latest.notes ? `<details><summary>変更点</summary><pre>${esc(u.latest.notes)}</pre></details>` : "");
  else if (u.state === "downloading") h += `<b>${esc(v)} をダウンロード中… ${u.progress}%</b>`;
  else if (u.state === "ready") h += `<b>入れ替えて起動し直しています…</b> 少し待つと新しい版で開き直します。`;
  else h += `<b>アップデートできませんでした</b> ${esc(u.error)} <button id="upgo">もう一度</button>`;
  el.innerHTML = h + `</div>`;
  const b = $("#upgo");
  if (b) b.onclick = async () => {
    b.disabled = true;
    try { UPDATE = await (await fetch("/api/update?do=install", { method: "POST" })).json(); } catch {}
    drawUpdate();
    const t = setInterval(async () => { await checkUpdate(); if (!UPDATE || !["downloading"].includes(UPDATE.state)) clearInterval(t); }, 1000);
  };
}
if (LOCAL) {
  PW = "local";
  checkUpdate(); setInterval(() => checkUpdate(), 60000);
  $("#logout").hidden = true;
  document.querySelector("#app h1").insertAdjacentHTML("afterend", `<span class="tag on" title="この PC のツールから直接表示しています">この PC</span>`);
  setInterval(() => { if (!document.hidden && TAB !== "settings") load(); }, 5000);
  load();
} else if (PW) load(); else showLogin("");
</script>
</body>
</html>
